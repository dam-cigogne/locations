  openSheet(`<h2>Coller une candidature reçue</h2><div class="info">Les formulaires (candidature ou dossier) envoient un e-mail à ton adresse. Pour une candidature : copie le texte (de « CANDIDATURE » au message) et colle-le ici. Pour un dossier : enregistre les pièces jointes dans Fichiers, puis choisis-les toutes ci-dessous avec dossier.txt.</div>
    <label class="f">Texte reçu<textarea id="cp-txt" style="min-height:220px" placeholder="CANDIDATURE – …&#10;Nom : …"></textarea></label>
    <div class="btns"><button class="btn ghost sm" data-act="cd-paste-read">Coller depuis le presse-papiers</button></div>
    <label class="f">Ou choisis les fichiers reçus (candidature.txt ou dossier.txt, et les pièces)<input id="cp-files" type="file" multiple accept=".txt,text/plain,.pdf,image/*"></label>
    <div class="small muted">Enregistre d'abord les pièces jointes de l'e-mail dans Fichiers, puis sélectionne-les toutes ici : le texte remplit la fiche, les autres fichiers y sont joints.</div>
    <div class="btns"><button class="btn" style="flex:1" data-act="cd-paste-ok">Créer la fiche</button><button class="btn ghost" data-act="sheetclose">Annuler</button></div>`);
}

function candCard(bien){
  const link = candLink(bien);
  return `<div class="card"><h2>Formulaire de candidature</h2>
    <div class="small muted">Quand quelqu'un te contacte, envoie-lui ce lien : il remplit ses informations et son e-mail t'arrive tout préparé. Tu colles ensuite le texte reçu ici et la fiche se remplit toute seule.</div>
    ${link ? `<label class="f">Lien à envoyer<input id="cd-link" readonly value="${esc(link)}"></label>
    <div class="btns"><button class="btn sm" data-act="cd-link-copy">Copier le lien</button><button class="btn sm ghost" data-act="cd-link-share">Partager le lien</button></div>` : '<div class="info" style="background:var(--warn-soft)">Indique d\'abord ton e-mail dans « Annonce › Modifier » : le formulaire envoie les candidatures à cette adresse.</div>'}
    <div class="small muted">Après la visite, le courrier « Demande du dossier » contient un 2e formulaire (une case par pièce : identité, domicile, contrat, bulletins, avis d'imposition, garant).</div>
    <div class="btns"><button class="btn sm ghost" data-act="cd-paste">Coller une candidature ou un dossier reçu</button></div></div>`;
}

async function candAttach(c, files){
  let n = 0; c.fichiers = c.fichiers || [];
  for (const f of files){ const fid = uid(); try { const buf = await f.arrayBuffer(); await flPut(fid, {name:f.name, type:f.type || (/\.pdf$/i.test(f.name) ? "application/pdf" : "application/octet-stream"), buf}); const dc = dosCode(f.name); c.fichiers.push({fid, nom:dc && /^[a-z]*g?(id|dom|act|bul|imp|res)-\d/i.test(f.name) ? DOS_LABEL[dc] + " (" + f.name + ")" : f.name, date:todayIso()}); if (dc){ c.pieces = c.pieces || {}; c.pieces[DOS_CODES[dc]] = c.pieces[DOS_CODES[dc]] || todayIso(); if (/^g/.test(dc) && !c.garant) c.garant = "proche"; } n++; } catch(e){ toast("Fichier non enregistré (" + f.name + ") : " + (e && e.message || "erreur")); } }
  if (n) c.upd = Date.now(); return n;
}

/* ---------- Dossier du locataire (repris de sa candidature) ---------- */
const TD_TYPES = ["Pièce d'identité", "Justificatif de domicile", "Contrat de travail", "Bulletin de salaire", "Avis d'imposition", "Bail / avenant", "Assurance habitation", "Autre"];
function tenantDocs(tid){
  const L = docList("docs").filter(x => x.kind === "loc" && x.loc === tid && !x.del).sort((a, b) => (a.ptype || "").localeCompare(b.ptype || "") || (a.nom || "").localeCompare(b.nom || ""));
  const rows = L.map(d => `<div class="row">${thumb(d.id, d.fname || d.nom, d.type)}<div class="main"><div class="t" style="font-size:13.5px">${esc(d.nom)}</div><div class="s">${esc(d.ptype || "Document")} · ${frDate(d.date)} · ${sizeStr(d.size || 0)}</div></div><button class="mini" data-act="td-open" data-id="${d.id}">Ouvrir</button><button class="mini" data-act="td-del" data-id="${d.id}" data-tid="${tid}" aria-label="Retirer">×</button></div>`).join("");
  return `<details open class="card" style="padding:12px;gap:6px;background:var(--bg)"><summary style="font-weight:700;font-size:15px;cursor:pointer">Documents du locataire · ${L.length}</summary>
    <div class="small muted">Choisis les fichiers dans Fichiers (iCloud Drive, Sur mon iPhone…) : l'appli en garde une copie, ouvrable d'un clic. Les documents restent sur cet appareil, non inclus dans la sauvegarde.</div>
    <div class="rows">${rows || '<div class="small muted">Aucun document.</div>'}</div>
    <label class="f">Type de pièce<select id="td-type">${TD_TYPES.map(x => `<option>${esc(x)}</option>`).join("")}</select></label>
    <label class="f">Ajouter des documents<input id="td-file" data-tid="${tid}" type="file" multiple accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.txt"></label></details>`;
}
function tenantDossier(tid){
  const c = candList().find(x => !x.del && x.loc === tid); if (!c) return tenantDocs(tid);
  const g = (CAND_GARANT.find(x => x[0] === (c.garant || "")) || [0, ""])[1], row = (l, v) => v ? `<div class="kv"><span>${esc(l)}</span><b>${esc(String(v))}</b></div>` : "";
  const pcs = CAND_PIECES.filter(p => c.pieces && c.pieces[p[0]]).map(p => `<div class="small">✓ ${esc(p[1])} · reçu le ${frDate(c.pieces[p[0]])}</div>`).join("");
  const fl = (c.fichiers || []).map(f => `<div class="row">${thumb(f.fid, f.nom)}<div class="main"><div class="t" style="font-size:13.5px">${esc(f.nom)}</div><div class="s">${frDate(f.date)}</div></div><button class="mini" data-act="cf-open" data-id="${c.id}" data-fid="${f.fid}">Ouvrir</button></div>`).join("");
  return `<details open class="card" style="padding:12px;gap:6px;background:var(--bg)"><summary style="font-weight:700;font-size:15px;cursor:pointer">Dossier de candidature · ${(c.fichiers || []).length} document(s)</summary>
    ${row("Demande du", c.dateDem ? frDate(c.dateDem) : "")}${row("Situation", c.contrat)}${row("Revenus nets / mois", c.rev ? eur(c.rev) : "")}${row("Occupants", c.occ)}${row("Emménagement souhaité", c.entree ? frDate(c.entree) : "")}${row("Garant", g && c.garant ? g : "")}${row("Revenus du garant", c.grev ? eur(c.grev) : "")}${row("Visite", c.visite ? fmtVisite(c.visite) : "")}
    ${c.note ? `<div class="small muted" style="white-space:pre-wrap">${esc(c.note)}</div>` : ""}
    <div class="small muted" style="margin-top:4px">Pièces reçues</div>${pcs || '<div class="small muted">Aucune pièce cochée</div>'}
    <div class="small muted" style="margin-top:4px">Documents (restent sur cet appareil, non inclus dans la sauvegarde)</div><div class="rows">${fl || '<div class="small muted">Aucun document</div>'}</div>
    <div class="btns"><button class="btn sm ghost" data-act="cd-open" data-id="${c.id}">Ouvrir la fiche candidat</button></div></details>` + tenantDocs(tid);
}

/* ---------- Miniatures et visionneuse (photos et PDF) ---------- */
const THUMB_IMG = "data:image/svg+xml;utf8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44"><rect width="44" height="44" rx="8" fill="#d8eee8"/><path d="M11 31l7-9 5 6 4-5 6 8z" fill="#0E6B5C" opacity=".55"/><circle cx="15" cy="15" r="3" fill="#0E6B5C" opacity=".55"/></svg>');
const THUMB_PDF = "data:image/svg+xml;utf8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44"><rect width="44" height="44" rx="8" fill="#f3d9d6"/><rect x="12" y="8" width="20" height="28" rx="3" fill="#fff"/><text x="22" y="26" font-size="9" font-weight="700" text-anchor="middle" fill="#b3261e" font-family="sans-serif">PDF</text></svg>');
const isPdfName = n => /\.pdf$/i.test(n || "");
const isImgName = n => /\.(jpe?g|png|gif|webp|heic|heif|bmp)$/i.test(n || "");
function thumb(fid, name, type){ const pdf = isPdfName(name) || type === "application/pdf", img = isImgName(name) || /^image\//.test(type || "");
  return `<img class="thumb" alt="" data-act="vw-open" data-fid="${fid}" data-name="${esc(name)}"${img ? ` data-thumb="${fid}"` : ""} src="${pdf ? THUMB_PDF : THUMB_IMG}">`; }
async function fillThumbs(){
  for (const im of document.querySelectorAll("img[data-thumb]")){ const fid = im.dataset.thumb; delete im.dataset.thumb;
    try { const r = await flGet(fid); if (r && r.buf && /^image\/(jpe?g|png|gif|webp|bmp)/.test(r.type || "")) im.src = URL.createObjectURL(new Blob([r.buf], {type:r.type})); } catch(e){} }
}
{ let tm = 0; new MutationObserver(() => { clearTimeout(tm); tm = setTimeout(fillThumbs, 60); }).observe(document.body, {childList:true, subtree:true}); }
function closeViewer(){ const v = document.getElementById("viewer"); if (v){ const m = v.querySelector("[data-blob]"); if (m) URL.revokeObjectURL(m.dataset.blob); v.remove(); } V.vw = null; }
async function viewFile(fid, name){
  const rec = await flGet(fid); if (!rec) return toast("Fichier introuvable sur cet appareil");
  const type = rec.type || mimeOf(name), isImg = /^image\//.test(type) && !/heic|heif/.test(type), isPdf = type === "application/pdf";
  if (!isImg && !isPdf) return saveFile(name || rec.name || "document", rec.buf, type);
  closeViewer(); V.vw = {name:name || rec.name || "document", buf:rec.buf, type};
  const url = URL.createObjectURL(new Blob([rec.buf], {type})), v = document.createElement("div"); v.id = "viewer";
  v.innerHTML = `<div class="vbar"><span class="vt">${esc(V.vw.name)}</span><button class="mini" data-act="vw-share">Partager</button><button class="mini" data-act="vw-close">Fermer</button></div>` +
    (isImg ? `<div class="vimg"><img data-blob="${url}" src="${url}" alt=""></div>` : `<iframe data-blob="${url}" src="${url}" title="${esc(V.vw.name)}"></iframe>`);
  document.body.appendChild(v);
}


/* ---------- Clôturer un locataire (départ) ---------- */
function sheetClot(tid){
  const t = S.locataires.find(x => x.id === tid); if (!t) return;
  const c = candList().find(x => !x.del && x.loc === tid), nd = docList("docs").filter(x => x.kind === "loc" && x.loc === tid && !x.del).length, nf = c ? (c.fichiers || []).length : 0;
  openSheet(`<h2>Clôturer · ${esc(t.nom)}</h2>
    <div class="small muted">À faire quand le locataire est parti (ou part). Cela : 1) enregistre la date de fin du bail, 2) coche les étapes « Retenues », « Dépôt restitué » et « Locataire clos » du départ (Biens › Arrivée/Départ), 3) calcule le dépôt à rendre. Tu peux annuler en rouvrant la fiche : rien n'est supprimé sans ta case cochée.</div>
    <label class="f">Date de fin du bail (départ)<input id="tc-fin" type="date" value="${esc(t.fin || todayIso())}"></label>
    <div class="kv"><span>Dépôt de garantie versé</span><b>${eur(t.depot || 0)}</b></div>
    <label class="f">Retenues justifiées (€) — dégradations, loyers impayés… avec devis ou factures<input id="tc-ret" inputmode="decimal" value="0"></label>
    <div class="kv"><span>Dépôt à restituer</span><b id="tc-rest" data-dep="${t.depot || 0}">${eur(t.depot || 0)}</b></div>
    <label style="display:flex;gap:10px;align-items:flex-start;font-size:14px"><input type="checkbox" id="tc-res"> Le dépôt a déjà été rendu (coche l'étape « Dépôt restitué »)</label>
    <label style="display:flex;gap:10px;align-items:flex-start;font-size:14px"><input type="checkbox" id="tc-op"> Préparer l'opération de remboursement dans le journal (tu vérifies la catégorie et tu enregistres : rien n'est écrit tout seul)</label>
    <label style="display:flex;gap:10px;align-items:flex-start;font-size:14px"><input type="checkbox" id="tc-erase"> Effacer le dossier de candidature et les documents de ce locataire (${nf + nd} fichier(s), définitif, de cet appareil seulement)</label>
    <div class="small muted">Conseil : garde le dossier tant que le dépôt n'est pas rendu et que le décompte final n'est pas accepté.</div>
    <div class="btns"><button class="btn" style="flex:1" data-act="tcl-ok" data-id="${tid}">Clôturer</button><button class="btn ghost" data-act="ledit" data-id="${tid}">Annuler</button></div>`);
}
document.addEventListener("input", ev => { const i = ev.target; if (!i || i.id !== "tc-ret") return; const o = document.getElementById("tc-rest"); if (!o) return;
  o.textContent = eur(Math.max(0, (+o.dataset.dep || 0) - (parseNum(i.value) || 0))); });
document.addEventListener("click", async ev => {
  const b = ev.target.closest("[data-act]"); if (!b) return; const a = b.dataset.act, id = b.dataset.id;
  if (a === "tcl-open"){ sheetClot(id); return; }
  if (a !== "tcl-ok") return;
  const t = S.locataires.find(x => x.id === id); if (!t) return;
  const fin = document.getElementById("tc-fin").value; if (!fin) return toast("Indique la date de fin");
  const ret = Math.max(0, parseNum(document.getElementById("tc-ret").value) || 0), rest = Math.max(0, (t.depot || 0) - ret);
  const wRes = document.getElementById("tc-res").checked, wOp = document.getElementById("tc-op").checked, wEr = document.getElementById("tc-erase").checked;
  t.fin = fin; t.upd = Date.now();
  t.note = ((t.note ? t.note + " · " : "") + "Clôturé le " + frDate(todayIso()) + (t.depot ? " · dépôt " + eur(t.depot) + ", retenues " + eur(ret) + ", à restituer " + eur(rest) : "")).trim();
  const r = mvtRec(t.bien, "dep"), td = todayIso(); if (ret > 0) r.done.ret = r.done.ret || td; if (wRes) r.done.res = r.done.res || td; r.done.clo = td; r.upd = Date.now();
  if (wEr){ const c = candList().find(x => !x.del && x.loc === id); if (c) await cdErase(c.id);
    for (const d of docList("docs").filter(x => x.kind === "loc" && x.loc === id && !x.del)){ d.del = true; d.upd = Date.now(); await flDel(d.id); } }
  persist(); closeSheet();
  if (wOp && rest > 0){ V.back = V.tab; V.editId = null; V.draft = newDraft({type:"Dépense", bien:t.bien, cat:"Divers", lib:"Restitution dépôt de garantie - " + t.nom, mont:fmtNum(rest), montAuto:false, note:"Dépôt " + eur(t.depot || 0) + " moins retenues " + eur(ret)}); V.tab = "add"; render(); toast("Vérifie la catégorie puis enregistre"); return; }
  V.tab = "bld"; V.bsel = t.bien; V.bsub = "mvt"; render(); toast("Locataire clôturé : à restituer " + eur(rest));
});


/* ---------- Dossier rangé par locataire (ZIP) : Gestion locative / bien / Locataires / nom / ... ---------- */
async function locataireFiles(tid){
  const t = S.locataires.find(x => x.id === tid && !x.del); if (!t) return [];
  const root = "Gestion locative/" + cleanName(bienName(t.bien)) + "/Locataires/" + cleanName(t.nom), out = [], used = new Set();
  const mine = d => d.tid ? d.tid === tid : ((tenantFor(t.bien, d.date || todayIso()) || {}).id === tid);
  const add = (dir, name, data) => { let n = root + "/" + dir + "/" + cleanName(name), i = 2; const k = n.lastIndexOf(".");
    while (used.has(n)) n = (k < 0 ? n : n.slice(0, k)) + " (" + i++ + ")" + (k < 0 ? "" : n.slice(k)); used.add(n); out.push({name:n, data}); };
  const addFiles = async (kind, dir) => { for (const d of fileDocs(t.bien, kind).filter(mine)){ const r = await flGet(d.id); if (r) add(dir, d.date + " - " + (d.fname || d.nom), new Uint8Array(r.buf)); } };
  const enc = new TextEncoder(), fiche = ["FICHE LOCATAIRE", "Nom : " + t.nom, "Bien : " + bienName(t.bien), t.tel ? "Téléphone : " + t.tel : "", t.email ? "E-mail : " + t.email : "", "Début du bail : " + (t.debut ? frDate(t.debut) : ""), "Fin du bail : " + (t.fin ? frDate(t.fin) : ""), "Loyer charges comprises : " + eur(t.loyer || 0), "Dont charges : " + eur(t.charges || 0), "Dépôt de garantie : " + eur(t.depot || 0), t.note ? "Note : " + t.note : ""].filter(Boolean).join("\n");
  add("00 Fiche", "Fiche locataire.txt", enc.encode(fiche));
  await addFiles("bail", "01 Bail");
  for (const e of docList("edl").filter(x => x.bien === t.bien && !x.del && mine(x))){ if (e.fichier && !e.pieces.some(p => p.items.some(i => i.etat || i.com || (i.ph || []).length))) continue;
    add("02 États des lieux", e.date + " - État des lieux " + (e.type === "sortie" ? "sortie" : "entrée") + (e.sig ? " (signé)" : "") + ".pdf", await edlPdf(e)); }
  await addFiles("edl", "02 États des lieux");
  for (const e of docList("inv").filter(x => x.bien === t.bien && !x.del && mine(x))){ if (e.fichier && !e.items.some(i => i.etat || i.com)) continue;
    add("03 Inventaires", e.date + " - Inventaire " + (e.type === "sortie" ? "sortie" : "entrée") + (e.sig ? " (signé)" : "") + ".pdf", invPdf(e)); }
  await addFiles("inv", "03 Inventaires");
  const c = candList().find(x => !x.del && x.loc === tid);
  if (c) for (const f of (c.fichiers || [])){ const r = await flGet(f.fid); if (r) add("04 Dossier de candidature", f.nom, new Uint8Array(r.buf)); }
  for (const d of docList("docs").filter(x => x.kind === "loc" && x.loc === tid && !x.del)){ const r = await flGet(d.id); if (r) add("05 Documents du locataire", (d.ptype ? d.ptype + " - " : "") + (d.fname || d.nom), new Uint8Array(r.buf)); }
  return out;
}
async function exportLocataires(ids, nom){
  toast("Préparation du dossier…"); let files = []; for (const id of ids) files = files.concat(await locataireFiles(id));
  if (files.length <= ids.length) return toast("Rien à ranger pour l'instant");
  await saveFile(nom + ".zip", zipStore(files), "application/zip");
}
document.addEventListener("click", async ev => {
  const b = ev.target.closest("[data-act]"); if (!b) return;
  if (b.dataset.act === "zip-loc"){ const t = S.locataires.find(x => x.id === b.dataset.id); if (t) await exportLocataires([t.id], "Gestion locative - " + cleanName(t.nom)); }
  if (b.dataset.act === "zip-loc-all") await exportLocataires(live(S.locataires).map(x => x.id), "Gestion locative");
});

/* ============ Démarrage ============ */
const migrate = () => { if (!S.cfg || typeof S.cfg !== "object") S.cfg = {bailleur:"", adr:{}}; if (!Array.isArray(S.modeles)) S.modeles = []; if (!Array.isArray(S.clotures)) S.clotures = []; if (!S.rapp || typeof S.rapp !== "object") S.rapp = {}; for (const k of ["biens","tarifs","journal","factures","locataires","seen","partages","edl","inv","docs"]) if (!Array.isArray(S[k])) S[k] = []; };
function startApp(){
  S = load();
  if (!S || !Array.isArray(S.journal)){ S = emptyData(); persist(); }
  migrate(); render(); bootRoutines();
}
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) { try { navigator.serviceWorker.register("sw.js").catch(() => {}); } catch(e){} }
window.HAD_DATA = !!(lsGet(KEY) || lsGet(ENC));
secCfgLoad();
faceOK().then(v => { V.faceOK = v; });
if (secAvailable() && lsGet(ENC)){ SEC.on = true; showLock(); } else startApp();

</script>
