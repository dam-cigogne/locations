<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mes locations</title>
<meta name="theme-color" content="#0E6B5C">
<script>
(function(){
  var PALS={emeraude:["#0E6B5C","#3CC2A6"],ocean:["#1F6FB5","#6DB3F2"],violet:["#6B4FC8","#A99BF0"],soleil:["#D2561B","#FF9A5C"],rose:["#C2336F","#F27AA8"]};
  function ls(k){try{return localStorage.getItem(k)}catch(e){return null}}
  window.LOC_PALS=PALS;
  window.isDarkNow=function(){
    var m=ls("loc-theme")||"auto"; if(m==="dark")return true; if(m==="light")return false;
    if(m==="sched"){ var s={}; try{s=JSON.parse(ls("loc-sched")||"{}")}catch(e){}
      var f=s.from||"20:00",t=s.to||"07:00",d=new Date(),n=d.getHours()*60+d.getMinutes(),a=+f.slice(0,2)*60+ +f.slice(3,5),b=+t.slice(0,2)*60+ +t.slice(3,5);
      return a<=b ? (n>=a&&n<b) : (n>=a||n<b); }
    return !!(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches); };
  window.applyTheme=function(){
    var pal=ls("loc-pal")||"emeraude"; if(!PALS[pal])pal="emeraude"; var dk=window.isDarkNow(), r=document.documentElement;
    r.setAttribute("data-theme",dk?"dark":"light"); r.setAttribute("data-pal",pal);
    var m=document.querySelector('meta[name="theme-color"]'); if(m)m.setAttribute("content",dk?"#0E1715":PALS[pal][0]); };
  window.applyTheme();
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Instrument+Sans:wght@400;500;600&display=swap">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Locations">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
/* Mes locations : colonne unique 560px max, barre d'onglets fixe en bas, feuilles modales par le bas. */
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --ink:#16231F; --muted:#5C6B66; --line:#DDE5E1;
  --accent:#0E6B5C; --accent-ink:#FFFFFF; --accent-soft:#D8EEE8;
  --ok:#1E7F4F; --warn:#A8690F; --bad:#B3372B; --bad-soft:#F7E2DE; --warn-soft:#F8EBD3;
  --font-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
:root[data-pal="ocean"]{--accent:#1F6FB5;--accent-ink:#FFFFFF;--accent-soft:#DCEAF7}
:root[data-pal="violet"]{--accent:#6B4FC8;--accent-ink:#FFFFFF;--accent-soft:#E8E1F8}
:root[data-pal="soleil"]{--accent:#D2561B;--accent-ink:#FFFFFF;--accent-soft:#FBE5D8}
:root[data-pal="rose"]{--accent:#C2336F;--accent-ink:#FFFFFF;--accent-soft:#F9DFEA}
:root[data-theme="dark"]{
  --bg:#0E1715; --surface:#16221F; --ink:#E6EFEC; --muted:#94A8A2; --line:#263631;
  --ok:#5BD08F; --warn:#E2B04E; --bad:#F08B7E; --bad-soft:#3A201C; --warn-soft:#3A2F15;
  color-scheme:dark;
}
:root[data-theme="dark"][data-pal="emeraude"]{--accent:#3CC2A6;--accent-ink:#06201A;--accent-soft:#17352E}
:root[data-theme="dark"][data-pal="ocean"]{--accent:#6DB3F2;--accent-ink:#08213A;--accent-soft:#17324D}
:root[data-theme="dark"][data-pal="violet"]{--accent:#A99BF0;--accent-ink:#1B1340;--accent-soft:#2C2552}
:root[data-theme="dark"][data-pal="soleil"]{--accent:#FF9A5C;--accent-ink:#2E1304;--accent-soft:#43281A}
:root[data-theme="dark"][data-pal="rose"]{--accent:#F27AA8;--accent-ink:#35081D;--accent-soft:#4A1F33}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);padding-bottom:110px;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-top:14px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance}
h2{font-size:17px;letter-spacing:.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:13px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.top .app{font-family:var(--font-display);font-weight:700;font-size:20px}
.topr{display:flex;align-items:center;gap:8px}
.nav{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px}
.nav button{border:0;background:none;width:36px;height:36px;border-radius:50%;font-size:20px;line-height:1;color:var(--ink)}
.nav button:active{background:var(--accent-soft)}
.nav span{min-width:104px;text-align:center;font-weight:600}
.gear{border:1px solid var(--line);background:var(--surface);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--ink);flex:none}
.gear svg{width:20px;height:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 2px rgba(20,30,40,.05),0 6px 18px -10px rgba(20,30,40,.18)}
.hero{background:linear-gradient(145deg,var(--accent) 0%,color-mix(in srgb,var(--accent) 70%,#000) 100%);color:var(--accent-ink);border:0;gap:6px;border-radius:24px;padding:20px 18px}
.hero .lbl{font-size:13px;opacity:.85;letter-spacing:.04em;text-transform:uppercase}
.hero .big{font-family:var(--font-display);font-weight:700;font-size:42px;line-height:1.05;letter-spacing:-.01em}
.hero .sub{font-size:13px;opacity:.88}
.hero .kv{opacity:.95}
.banner{background:var(--warn-soft);border:1px solid var(--warn);border-radius:12px;padding:10px 12px;font-size:13px}
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .t{font-weight:500;overflow-wrap:anywhere}
.row .s{font-size:12.5px;color:var(--muted)}
.row .amt{font-weight:600}
.pos{color:var(--ok)} .neg{color:var(--bad)}
.rowbtn{background:none;border:0;text-align:left;padding:0;flex:1;min-width:0}
.rowbtn:active{opacity:.6}
.bp{display:inline-block;color:#fff;font-weight:700;font-size:12px;padding:2px 9px;border-radius:999px;line-height:1.4;white-space:nowrap}
.bourse{background:linear-gradient(145deg,#7030A0 0%,#53247A 100%);color:#fff;border:0}
.bourse .lbl{font-size:12.5px;opacity:.9;letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.bourse .big{font-family:var(--font-display);font-weight:700;font-size:30px}
.bourse .btn{background:#fff;color:#7030A0}
.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.ok{background:#DDF0E5;color:var(--ok)}
:root[data-theme="dark"] .chip.ok{background:#1B3A2A}
.chk{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:none;flex:none;display:grid;place-items:center;color:var(--accent-ink)}
.chk.on{background:var(--accent);border-color:var(--accent)}
.chk svg{width:14px;height:14px;opacity:0}
.chk.on svg{opacity:1}
.mg{display:flex;gap:2px;height:16px;border-radius:999px;background:var(--line);overflow:hidden;margin:10px 0 8px;border:1px solid var(--line)}.mg i{display:block;height:100%}.mgl{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:13px;font-weight:600;color:var(--ink)}.mgl b{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}
.bar{height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.bar i.warn{background:var(--warn)} .bar i.bad{background:var(--bad)} .bar i.ok{background:var(--ok)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13.5px}
.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;color:var(--ink);font-size:16px;width:100%;min-width:0}
label.f textarea{min-height:110px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:14px;padding:13px 16px;transition:transform .08s ease,opacity .15s;font-weight:600;background:var(--accent);color:var(--accent-ink);font-size:15px;text-decoration:none;display:inline-block;text-align:center}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{padding:8px 13px;font-size:13.5px;border-radius:999px}
.btn:active{transform:scale(.97)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.info{font-size:13px;background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:8px 10px}
.info.bad{background:var(--bad-soft);color:var(--bad)}
details summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:8px}
details summary::-webkit-details-marker{display:none}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:14px}
.kv.tot{border-top:1px solid var(--line);font-weight:600;margin-top:4px;padding-top:8px}
.hero .kv.tot{border-top-color:rgba(255,255,255,.3)}
.empty{padding:14px 0;color:var(--muted);font-size:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.tile .n{font-family:var(--font-display);font-weight:700;font-size:26px}
.tile .l{font-size:12.5px;color:var(--muted)}
.tile.bad{border-color:var(--bad)} .tile.bad .n{color:var(--bad)}
.tile.warn .n{color:var(--warn)}
.tiles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.mrow{display:grid;grid-template-columns:44px 1fr 74px;gap:8px;align-items:center;font-size:13px}
.mrow .bars{display:flex;flex-direction:column;gap:3px}
.mrow .bar{height:6px}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:11px 14px;font-size:16px;color:var(--ink)}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:12.5px;font-weight:600;color:var(--ink);text-decoration:none;display:inline-block}
.mini.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;pointer-events:none;
  padding:0 max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));z-index:20}
nav.tabs .in{display:flex;width:100%;max-width:560px;pointer-events:auto;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:26px;padding:4px 6px;box-shadow:0 10px 30px -12px rgba(0,0,0,.35)}
nav.tabs button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 5px;font-size:10.5px;color:var(--muted);min-width:0;border-radius:18px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on:not(.add){background:var(--accent-soft)}
nav.tabs button.on{color:var(--accent);font-weight:600}
nav.tabs button.add span.pl{background:var(--accent);color:var(--accent-ink);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;margin-top:-16px;box-shadow:0 6px 14px -4px color-mix(in srgb,var(--accent) 70%,#000)}
nav.tabs button.add{color:var(--ink)}
#sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
#sheet{background:var(--surface);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:88%;overflow:auto;display:flex;flex-direction:column;gap:12px}
#sheet>*{flex-shrink:0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:999px;font-size:13.5px;z-index:50;max-width:90%}
#lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
.lockin{width:100%;max-width:340px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.lockt{font-family:var(--font-display);font-weight:700;font-size:26px}
#lockmsg{color:var(--muted);font-size:14px;min-height:20px}#lockmsg.bad{color:var(--bad)}
.dots{display:flex;gap:12px;min-height:16px}.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent);display:block}.dots i.on{background:var(--accent)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px;justify-content:center}
.pad button{height:72px;width:72px;padding:0;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:24px;font-family:var(--font-display);font-weight:600;display:grid;place-items:center}
.pad button:active{background:var(--accent-soft)}
.pad button svg{width:26px;height:26px}
body.priv #main,body.priv #tabs{visibility:hidden}
body.welcome #tabs{display:none}
body.welcome{padding-bottom:40px}

/* ---- effets verre / gloss ---- */
.btn{background-image:linear-gradient(180deg,rgba(255,255,255,.24),rgba(255,255,255,0) 60%);box-shadow:inset 0 1px 0 rgba(255,255,255,.38),0 8px 16px -8px color-mix(in srgb,var(--accent) 65%,transparent)}
.btn.ghost,.btn.danger{background-image:none;box-shadow:none}
.card{box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 1px 2px rgba(20,30,40,.05),0 8px 20px -12px rgba(20,30,40,.22)}
:root[data-theme="dark"] .card{box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 8px 20px -12px rgba(0,0,0,.6)}
.hero{position:relative;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -14px 28px rgba(0,0,0,.14),0 14px 28px -14px color-mix(in srgb,var(--accent) 80%,#000)}
.hero::before{content:"";position:absolute;inset:0 0 55% 0;background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,0));pointer-events:none}
.hero > *{position:relative}
.glass{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:6px 12px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.bourse{box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 14px 28px -14px #53247A}
.top .app{font-size:21px}
.q{border:1px solid var(--line);background:var(--surface);width:34px;height:34px;border-radius:50%;font-family:var(--font-display);font-weight:700;font-size:16px;color:var(--accent);flex:none;display:grid;place-items:center;padding:0}
.q:active{background:var(--accent-soft)}
.chip.slate{background:var(--line);color:var(--muted)}
.cdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle;flex:none}
.env .bar i{background:var(--c,var(--accent))}
nav.tabs button.add span.pl{box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 8px 16px -4px color-mix(in srgb,var(--accent) 75%,#000);background-image:linear-gradient(180deg,rgba(255,255,255,.25),rgba(255,255,255,0))}
#sheetbg{backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);animation:fadein .2s ease}
#sheet{animation:slideup .26s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 40px -12px rgba(0,0,0,.4)}
.grab{width:42px;height:5px;border-radius:999px;background:var(--line);margin:-6px auto 2px;flex:none}
@keyframes slideup{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
#toast{animation:fadein .2s ease;box-shadow:0 10px 24px -10px rgba(0,0,0,.5)}
/* ---- saisie du montant ---- */
.amt-in{width:100%;border:0!important;background:transparent!important;text-align:center;font-family:var(--font-display);font-weight:700;font-size:44px!important;letter-spacing:-.01em;padding:4px 0!important}
.amtbox{background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:8px 12px;display:flex;flex-direction:column;align-items:center}
.amtbox small{color:var(--muted);font-size:12.5px}
.npad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.npad button{height:52px;border-radius:16px;border:1px solid var(--line);background:var(--surface);font-family:var(--font-display);font-weight:600;font-size:22px;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.npad button:active{background:var(--accent-soft)}
/* ---- réglages / thèmes ---- */
.pals{display:flex;gap:10px;flex-wrap:wrap}
.pal{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;color:var(--muted);background:none;border:0;padding:0;width:62px}
.pal i{width:44px;height:44px;border-radius:50%;display:block;border:3px solid transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.pal.on{color:var(--ink);font-weight:600}.pal.on i{border-color:var(--ink)}
.tl{display:flex;gap:10px}.tl label.f{flex:1}
details.h{border-top:1px solid var(--line);padding:8px 0}details.h:first-of-type{border-top:0}
details.h p{margin:6px 0 0;font-size:14px}details.h ul{margin:6px 0 0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.ver{text-align:center;color:var(--muted);font-size:12px;padding:6px 0 0}
.dxph{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}.dxp{position:relative}.dxp img{width:58px;height:58px;object-fit:cover;border-radius:8px;display:block;background:var(--line)}.dxp button{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:0;background:var(--bad);color:#fff;font-size:12px;line-height:20px;padding:0}
.dxi select,.dxi input,label.f select,label.f input{min-width:0}.dxi select,.dxi input:not([type=checkbox]):not([type=file]){border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 10px;color:var(--ink);font-size:16px;width:100%}
.dxi{align-items:end}

/* Tablette et grand écran : la mise en page s'élargit */
@media (min-width:700px){
  .wrap{max-width:760px} nav.tabs .in{max-width:760px}
  #sheetbg{align-items:center} #sheet{max-width:680px;border-radius:18px;max-height:86%}
}
@media (min-width:1000px){
  .wrap{max-width:900px}
  .wrap[data-tab=home],.wrap[data-tab=chart]{max-width:1160px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start;column-gap:16px;row-gap:14px}
  .wrap[data-tab=home]>*,.wrap[data-tab=chart]>*{grid-column:1/-1}
  .wrap[data-tab=home]>.card:not(.hero),.wrap[data-tab=chart]>.card:not(.hero){grid-column:auto}
  nav.tabs .in{max-width:780px}
}

.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;flex:none;background:var(--accent-soft);cursor:pointer}
#viewer{position:fixed;inset:0;z-index:70;background:#000;display:flex;flex-direction:column}

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
"use strict";
/* ============ Constantes ============ */
const KEY = "gestion-locative-v1";           // clé localStorage propre à cette appli (≠ appli comptes)
const IDB_NAME = "loc-sec";                   // base IndexedDB propre à cette appli
const MOIS = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
const MC = ["Janv","Févr","Mars","Avr","Mai","Juin","Juil","Août","Sept","Oct","Nov","Déc"];
const TYPES = ["Recette","Dépense","Sortie","Entrée"];
const TYPE_LAB = {"Recette":"Recette","Dépense":"Dépense","Sortie":"Épargne (sortie)","Entrée":"Entrée"};
const CATS = {
  "Recette":["Loyer","Remboursement","Autre recette"],
  "Dépense":["Crédit (mensualité)","Assurance PNO","Assurance GMPA","Syndic / copropriété","Eau","Électricité","Taxe foncière","CFE","Comptabilité","CGA / OGA","Abonnement Rendement locatif","Entretien / réparations","Mobilier / équipement","Diagnostics","Frais bancaires / cotisations","Divers"],
  "Sortie":["Bourse","Livret A","PEL","Autre placement","Assurance vie","Placement","Prêt","Transfert entre comptes","Achat personnel","Remboursement","Écart de rapprochement","Autre"],
  "Entrée":["Bourse","Livret A","PEL","Autre placement","Intérêts placement","Assurance vie","Placement","Prêt","Transfert entre comptes","Achat personnel","Remboursement","Écart de rapprochement","Autre"]
};
const FAMILLE = {"Crédit (mensualité)":"Crédit","Assurance PNO":"Assurances","Assurance GMPA":"Assurances","Taxe foncière":"Taxes","CFE":"Taxes","Comptabilité":"Compta & gestion","CGA / OGA":"Compta & gestion","Abonnement Rendement locatif":"Compta & gestion","Syndic / copropriété":"Copropriété & énergie","Eau":"Copropriété & énergie","Électricité":"Copropriété & énergie","Entretien / réparations":"Travaux & équipement","Mobilier / équipement":"Travaux & équipement","Diagnostics":"Travaux & équipement","Frais bancaires / cotisations":"Divers","Divers":"Divers"};
const BIEN_COL0 = {"STUDIO":"#1B7F79", "T2":"#B03060"}, BIEN_PAL = ["#1B7F79","#B03060","#B8741A","#3B6FB6","#7A4FB3","#4C8A2E","#B5473A","#2F7F9E"];
const BIEN_COL = new Proxy({}, {get:(_, id) => { if (typeof id !== "string") return undefined; if (BIEN_COL0[id]) return BIEN_COL0[id]; const ids = (typeof S !== "undefined" && S && S.biens ? S.biens.map(b => b.id) : []).filter(i => !BIEN_COL0[i]); const k = ids.indexOf(id); return BIEN_PAL[(k < 0 ? 2 : 2 + k) % BIEN_PAL.length]; }});
const BOURSE_COL = "#7030A0";
const PARTAGE_CAT = {"CFE":"CFE","Comptabilité":"Comptabilité","CGA / OGA":"CGA / OGA","Rendement locatif":"Abonnement Rendement locatif"};
const POSTES_TARIF = ["Loyer","Crédit (mensualité)","Assurance GMPA","Assurance PNO"];
const NO_EPARGNE = ["Écart de rapprochement","Transfert entre comptes","Intérêts placement"];

/* ============ Utilitaires ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur = n => new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR"}).format(Number(n)||0);
const isNum = v => typeof v === "number" && isFinite(v);
const N = v => isNum(v) ? v : 0;
const r2 = v => Math.round(v * 100) / 100;
const uid = () => "a" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const pad = n => String(n).padStart(2,"0");
const todayIso = () => { const d = new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); };
const parseNum = s => { const t = String(s).replace(/\s/g,"").replace(",","."); const v = parseFloat(t); return isFinite(v) ? v : null; };
const fmtNum = v => (v === "" || v == null) ? "" : String(v).replace(".",",");
function serialToIso(s){ const d = new Date(Math.floor(s + 1e-6 - 25569) * 86400000); return d.toISOString().slice(0,10); }
function isoToSerial(iso){ const [y,m,d] = iso.split("-").map(Number); return Math.round(Date.UTC(y,m-1,d)/86400000) + 25569; }
function anyToIso(v){
  if (isNum(v)) return v > 20000 ? serialToIso(v) : "";
  if (v instanceof Date) return v.getFullYear()+"-"+pad(v.getMonth()+1)+"-"+pad(v.getDate());
  const s = String(v ?? "").trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return m[1]+"-"+m[2]+"-"+m[3];
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); if (m) return m[3]+"-"+pad(m[2])+"-"+pad(m[1]);
  return "";
}
const frDate = iso => iso ? iso.slice(8,10)+"/"+iso.slice(5,7)+"/"+iso.slice(0,4) : "";
const frDateL = iso => iso ? iso.slice(8,10)+"/"+iso.slice(5,7)+"/"+iso.slice(0,4) : "";
const norm = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-zA-Z0-9]/g,"").toLowerCase();
const str = v => v == null ? "" : String(v).trim();
const truthy = v => v === true || v === 1 || /^(1|x|oui|true|vrai)$/i.test(String(v ?? "").trim());
const sum = a => a.reduce((s,v) => s + N(v), 0);

/* ============ Données ============ */
let S = null, memCopy = null;
function load(){ try { const t = localStorage.getItem(KEY); if (t) return JSON.parse(t); } catch(e){} return memCopy; }
function persist(){ if (!S) return; memCopy = S; if (SEC.on){ SEC.dirty = true; if (!SEC.saving) flushEnc(); return; } try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }

/* ============ Sécurité : code, Face ID, chiffrement AES-GCM ============ */
const ENC = KEY + "-enc", SECK = KEY + "-sec";
const SEC = {on:false, dk:null, saving:false, dirty:false, away:0, pin:"", msg:"", ask:false, cfg:{face:false, cred:"", delay:30, fails:0, until:0}};
const lsGet = k => { try { return localStorage.getItem(k); } catch(e){ return null; } };
const lsSet = (k,v) => { try { localStorage.setItem(k,v); } catch(e){} };
const lsDel = k => { try { localStorage.removeItem(k); } catch(e){} };
const lsWorks = () => { try { localStorage.setItem(KEY+"-t","1"); const ok = localStorage.getItem(KEY+"-t") === "1"; localStorage.removeItem(KEY+"-t"); return ok; } catch(e){ return false; } };
const subtle = (window.crypto && crypto.subtle) || null;
function b64(u8){ let t = ""; for (let i = 0; i < u8.length; i += 8192) t += String.fromCharCode.apply(null, u8.subarray(i, i + 8192)); return btoa(t); }
const unb64 = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));
async function kek(pin, salt){ const base = await subtle.importKey("raw", new TextEncoder().encode(pin), "PBKDF2", false, ["deriveKey"]);
  return subtle.deriveKey({name:"PBKDF2", salt, iterations:200000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]); }
async function aesEnc(key, data){ const iv = crypto.getRandomValues(new Uint8Array(12)); const ct = new Uint8Array(await subtle.encrypt({name:"AES-GCM", iv}, key, data)); return {iv:b64(iv), ct:b64(ct)}; }
async function aesDec(key, o){ return new Uint8Array(await subtle.decrypt({name:"AES-GCM", iv:unb64(o.iv)}, key, unb64(o.ct))); }
const dkKey = raw => subtle.importKey("raw", raw, "AES-GCM", false, ["encrypt","decrypt"]);
function secCfgLoad(){ try { Object.assign(SEC.cfg, JSON.parse(lsGet(SECK) || "{}")); } catch(e){} }
const secCfgSave = () => lsSet(SECK, JSON.stringify(SEC.cfg));
async function flushEnc(){ SEC.saving = true;
  try { while (SEC.dirty && SEC.dk && S){ SEC.dirty = false; const blob = JSON.parse(lsGet(ENC)); blob.d = await aesEnc(SEC.dk, new TextEncoder().encode(JSON.stringify(S))); lsSet(ENC, JSON.stringify(blob)); } } catch(e){}
  SEC.saving = false; }
async function secFlushed(){ while (SEC.saving || SEC.dirty){ if (!SEC.saving) flushEnc(); await new Promise(r => setTimeout(r, 20)); } }
function idb(){ return new Promise((res,rej) => { const r = indexedDB.open(IDB_NAME,1); r.onupgradeneeded = () => r.result.createObjectStore("k"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function idbPut(k,v){ const db = await idb(); return new Promise((res,rej) => { const t = db.transaction("k","readwrite"); t.objectStore("k").put(v,k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); }
async function idbGet(k){ const db = await idb(); return new Promise((res,rej) => { const q = db.transaction("k").objectStore("k").get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
async function idbDel(k){ try { const db = await idb(); await new Promise(res => { const t = db.transaction("k","readwrite"); t.objectStore("k").delete(k); t.oncomplete = () => res(); t.onerror = () => res(); }); } catch(e){} }
const secAvailable = () => !!subtle && lsWorks() && location.protocol.indexOf("http") === 0;
async function faceOK(){ try { return !!(window.PublicKeyCredential && PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable && window.indexedDB && window.top === window.self && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); } catch(e){ return false; } }
async function faceRegister(){ const cred = await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)), rp:{name:"Mes locations", id:location.hostname},
  user:{id:crypto.getRandomValues(new Uint8Array(16)), name:"locations", displayName:"Mes locations"}, pubKeyCredParams:[{type:"public-key",alg:-7},{type:"public-key",alg:-257}],
  authenticatorSelection:{authenticatorAttachment:"platform", userVerification:"required", residentKey:"preferred"}, timeout:60000, attestation:"none"}}); return b64(new Uint8Array(cred.rawId)); }
async function faceAsk(){ await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)), rpId:location.hostname,
  allowCredentials:[{type:"public-key", id:unb64(SEC.cfg.cred), transports:["internal"]}], userVerification:"required", timeout:60000}}); }
async function secEnable(pin){
  const raw = crypto.getRandomValues(new Uint8Array(32)), salt = crypto.getRandomValues(new Uint8Array(16));
  const w = await aesEnc(await kek(pin, salt), raw); SEC.dk = await dkKey(raw);
  const d = await aesEnc(SEC.dk, new TextEncoder().encode(JSON.stringify(S)));
  lsSet(ENC, JSON.stringify({salt:b64(salt), w, d})); if (lsGet(ENC)) { lsDel(KEY); SEC.on = true; } SEC.cfg.fails = 0; secCfgSave(); }
async function secUnwrap(pin){ const blob = JSON.parse(lsGet(ENC)); return {blob, raw: await aesDec(await kek(pin, unb64(blob.salt)), blob.w)}; }
async function secDisable(){ await secFlushed(); lsSet(KEY, JSON.stringify(S)); lsDel(ENC); await idbDel("dk"); SEC.on = false; SEC.dk = null; SEC.cfg.face = false; SEC.cfg.cred = ""; secCfgSave(); }
async function secChange(oldPin, newPin){ await secFlushed(); const {blob, raw} = await secUnwrap(oldPin); const salt = crypto.getRandomValues(new Uint8Array(16));
  blob.salt = b64(salt); blob.w = await aesEnc(await kek(newPin, salt), raw); lsSet(ENC, JSON.stringify(blob)); }
function afterUnlock(plain){ S = JSON.parse(new TextDecoder().decode(plain)); memCopy = S; SEC.on = true; SEC.cfg.fails = 0; SEC.cfg.until = 0; secCfgSave(); migrate(); return true; }
async function unlockPin(pin){ try { const {blob, raw} = await secUnwrap(pin); SEC.dk = await dkKey(raw); return afterUnlock(await aesDec(SEC.dk, blob.d)); } catch(e){ SEC.dk = null; return false; } }
async function unlockFace(){ try { await faceAsk(); const dk = await idbGet("dk"); if (!dk) return false; const blob = JSON.parse(lsGet(ENC)); const plain = await aesDec(dk, blob.d); SEC.dk = dk; return afterUnlock(plain); } catch(e){ SEC.dk = null; return false; } }

function showLock(msg, bad){
  document.body.classList.remove("priv"); $("#lock").hidden = false; SEC.pin = ""; SEC.ask = false;
  const wait = Math.ceil((SEC.cfg.until - Date.now()) / 1000);
  $("#lockmsg").textContent = wait > 0 ? "Trop d'essais. Patiente " + wait + " s." : (msg || "Entre ton code"); $("#lockmsg").className = bad || wait > 0 ? "bad" : "";
  const key = n => `<button data-act="lk-d" data-id="${n}">${n}</button>`;
  $("#lockpad").innerHTML = [1,2,3,4,5,6,7,8,9].map(key).join("") + (SEC.cfg.face ? `<button data-act="lk-face" aria-label="Face ID">${ICON.face}</button>` : "<span></span>") + key(0) +
    `<button data-act="lk-del" aria-label="Effacer">⌫</button>`;
  $("#lockextra").innerHTML = SEC.ask ? "" : `<button class="btn ghost sm" data-act="lk-ok">Valider</button><button class="btn ghost sm" data-act="lk-forgot">Code oublié</button>`;
  lockDots();
}
function lockDots(){ $("#lockdots").innerHTML = Array.from({length:Math.max(4,SEC.pin.length)}, (_,i) => `<i class="${i < SEC.pin.length ? "on" : ""}"></i>`).join(""); }
function hideLock(){ $("#lock").hidden = true; document.body.classList.remove("priv"); render(); if (typeof bootRoutines === "function") bootRoutines(); }
async function lockSubmit(){
  if (Date.now() < SEC.cfg.until) return showLock("", true);
  if (SEC.pin.length < 4) return;
  const ok = await unlockPin(SEC.pin);
  if (ok) return hideLock();
  SEC.cfg.fails++; if (SEC.cfg.fails >= 5) SEC.cfg.until = Date.now() + Math.min(600, 15 * Math.pow(2, SEC.cfg.fails - 5)) * 1000; secCfgSave();
  showLock("Code incorrect", true);
}
async function lockNow(){ if (!SEC.on || !SEC.dk || !S) return; await secFlushed(); SEC.dk = null; S = null; memCopy = null; V.pending = null; closeSheet(); showLock(); }
document.addEventListener("visibilitychange", () => {
  if (!SEC.on) return;
  if (document.hidden){ if (S) document.body.classList.add("priv"); SEC.away = Date.now(); secFlushed(); }
  else if (S && SEC.away && Date.now() - SEC.away >= SEC.cfg.delay * 1000) lockNow(); else document.body.classList.remove("priv");
});

/* ============ Modèle de données ============ */
function emptyData(){ return { v:1, demo:false, biens:[], tarifs:[], journal:[], factures:[], locataires:[], seen:[], partages:[], rapp:{}, modeles:[], clotures:[], edl:[], inv:[], docs:[], cand:[], annonces:{}, cfg:{bailleur:"", adr:{}} }; }
const live = a => a.filter(x => !x.del);
const bienName = id => { const b = S.biens.find(x => x.id === id); return b ? b.nom : id; };
const bienIds = () => { const ids = live(S.biens).map(b => b.id); for (const j of S.journal) if (j.bien && !ids.includes(j.bien)) ids.push(j.bien); return ids; };
const J = () => S.journal.filter(j => !j.del && j.date);
const yr = j => +j.date.slice(0,4);
const mo = j => +j.date.slice(5,7) - 1;
const isIn = j => j.type === "Recette" || j.type === "Entrée";
function statut(j){ if (j.pointe === "x") return "Pointé"; if (j.date > todayIso()) return "Prévu"; return j.type === "Recette" ? "En retard" : "À pointer"; }
const impact = j => (j.pointe !== "x" || j.compte === "Perso") ? 0 : (isIn(j) ? 1 : -1) * N(j.montant);
function soldeBien(id, uptoYear){
  const b = S.biens.find(x => x.id === id);
  return r2(N(b && b.solde0) + sum(J().filter(j => j.bien === id && (uptoYear == null || yr(j) <= uptoYear)).map(impact)));
}
function soldeAvant(id, y){
  const b = S.biens.find(x => x.id === id);
  return r2(N(b && b.solde0) + sum(J().filter(j => j.bien === id && yr(j) < y).map(impact)));
}
function stats(id, y){   // id = null → tous les biens
  const L = J().filter(j => (id == null || j.bien === id) && yr(j) === y);
  const rec = sum(L.filter(j => j.type === "Recette").map(j => j.montant)), dep = sum(L.filter(j => j.type === "Dépense").map(j => j.montant));
  const recP = sum(L.filter(j => j.type === "Recette" && j.pointe === "x").map(j => j.montant)), depP = sum(L.filter(j => j.type === "Dépense" && j.pointe === "x").map(j => j.montant));
  const ep = sum(L.filter(j => j.type === "Sortie" && !NO_EPARGNE.includes(j.cat)).map(j => j.montant)) - sum(L.filter(j => j.type === "Entrée" && !NO_EPARGNE.includes(j.cat)).map(j => j.montant));
  const bourse = sum(L.filter(j => j.type === "Sortie" && j.cat === "Bourse").map(j => j.montant)) - sum(L.filter(j => j.type === "Entrée" && j.cat === "Bourse").map(j => j.montant));
  return {rec:r2(rec), dep:r2(dep), cf:r2(rec - dep), recP:r2(recP), depP:r2(depP), benef:r2(recP - depP), ep:r2(ep), bourse:r2(bourse)};
}
function counts(y){
  const L = J().filter(j => yr(j) === y);
  return { retard: J().filter(j => statut(j) === "En retard").length, pointer: J().filter(j => statut(j) === "À pointer").length,
           compta: L.filter(j => j.type === "Dépense" && j.pointe === "x" && !j.compta).length };
}
const bourseOn = () => { const c = S.cfg && S.cfg.bourse; return typeof c === "boolean" ? c : !!(S.demo || S.journal.some(j => !j.del && (j.cat === "Bourse" || j.cat === "Livret A" || j.cat === "PEL" || j.cat === "Autre placement"))); };
const bienPill = id => `<span class="bp" style="background:${BIEN_COL[id] || "var(--accent)"}">${esc(bienName(id))}</span>`;
function bourseOf(id, cat){
  const L = J().filter(j => j.cat === (cat || "Bourse") && (id == null || j.bien === id));
  const mis = r2(sum(L.filter(j => j.type === "Sortie").map(j => j.montant))), remb = r2(sum(L.filter(j => j.type === "Entrée").map(j => j.montant)));
  return {mis, remb, reste:r2(mis - remb)};
}
function splitPartage(total, part){ const a = r2(total * part); return [a, r2(total - a)]; }   // STUDIO arrondi, T2 = le reste
const partagesList = () => S.partages.length ? S.partages : Object.keys(PARTAGE_CAT).map(f => ({frais:f, total:0, partStudio:0.5}));
function tarifVigueur(bien, poste){
  const L = S.tarifs.filter(t => t.bien === bien && t.poste === poste && t.date && t.date <= todayIso()).sort((a,b) => b.date.localeCompare(a.date));
  return L[0] || null;
}
function tarifFor(bien, poste, iso){
  const L = S.tarifs.filter(t => t.bien === bien && t.poste === poste && t.date && t.date <= iso).sort((a,b) => b.date.localeCompare(a.date));
  return L.length ? L[0].montant : null;
}
function suggest(bien, cat, iso){
  const b = S.biens.find(x => x.id === bien); if (!b) return null;
  if (cat === "Loyer") return tarifFor(bien, "Loyer", iso) ?? (b.loyer || null);
  if (cat === "Crédit (mensualité)") return tarifFor(bien, cat, iso) ?? (b.credit || null);
  return tarifFor(bien, cat, iso);
}
function tenantFor(bien, iso){
  const L = live(S.locataires).filter(t => t.bien === bien);
  return L.find(t => (!t.debut || t.debut <= iso) && (!t.fin || t.fin >= iso)) || L[L.length - 1] || null;
}
function allCats(type){ const set = new Set(CATS[type] || []); for (const j of J()) if (j.type === type && j.cat) set.add(j.cat); return [...set]; }

function demoData(rich){
  const d = emptyData(); d.demo = true;
  d.biens = [{id:"STUDIO",nom:"Studio",solde0:2000,date0:"2021-12-31",loyer:500,credit:240,regime:"LMNP",notes:"",upd:0},{id:"T2",nom:"Appartement T2",solde0:1500,date0:"2021-12-31",loyer:650,credit:410,regime:"LMNP",notes:"",upd:0}];
  const y = new Date().getFullYear(), tm = new Date().getMonth();
  const mk = (bien,m,type,cat,lib,mt,pt) => ({id:uid(),date:y+"-"+pad(m+1)+"-01",bien,type,cat,lib,montant:mt,compte:"Bien",pointe:pt?"x":"",compta:"",justif:"",fourn:"",note:"",upd:0});
  for (let m = 0; m < 12; m++) for (const b of d.biens){
    const pt = m < tm || (m === tm);
    d.journal.push(mk(b.id,m,"Recette","Loyer","Loyer "+MOIS[m].toLowerCase(),b.loyer,pt && !(b.id==="T2" && m===tm)));
    d.journal.push(mk(b.id,m,"Dépense","Crédit (mensualité)","Crédit",b.credit,pt));
    d.journal.push(mk(b.id,m,"Dépense","Assurance PNO","Assurance PNO",20,pt));
  }
  d.factures = [{id:uid(),fourn:"Magasin exemple",num:"F-001",date:y+"-02-10",cat:"TRAVAUX",desc:"Peinture (exemple)",prix:180,jdmm:"",scan:"x",upd:0}];
  d.locataires = [{id:uid(),bien:"T2",nom:"Locataire Exemple",tel:"0600000000",email:"",debut:(y-1)+"-09-01",fin:"",loyer:650,depot:650,note:"Donnée d'exemple",upd:0},
    ];
  if (!rich) return d;
  d.locataires[0].nom = "Julien Exemple"; d.locataires.push({id:uid(),bien:"STUDIO",nom:"Camille Essai",tel:"0600000001",email:"",debut:(y-1)+"-03-01",fin:"",loyer:500,depot:500,note:"Donnée d'exemple",upd:0});

function mergeList(list, incoming){

  return {add, upd};
}

function viewBilan(){
  const y = V.y, ids = bienIds(), st = stats(null, y);
  const years = [...new Set(J().map(yr).concat([now0.getFullYear()]))].sort((a,b) => a - b);
  const months = MC.map((nm, m) => { const L = J().filter(j => yr(j) === y && mo(j) === m); return {nm, rec:sum(L.filter(j => j.type==="Recette").map(j => j.montant)), dep:sum(L.filter(j => j.type==="Dépense").map(j => j.montant))}; });
  const mx = Math.max(1, ...months.map(m => Math.max(m.rec, m.dep)));
  let cum = 0; const cumBy = {}; for (const yy of years){ cum += stats(null, yy).bourse; cumBy[yy] = cum; }
  return topbar("Bilan", yearNav()) + `
  <div class="card hero"><div class="lbl">Cash flow ${y} (2 biens)</div><div class="big num">${eur(st.cf)}</div>
    <div class="sub">Loyers ${eur(st.rec)} − charges ${eur(st.dep)}. Encaissé à ce jour : ${eur(st.benef)}.</div></div>

  <div class="card"><h2>Par bien</h2>${ids.map(id => { const s = stats(id, y); return `<div class="env" style="padding:6px 0"><div class="top"><b>${esc(bienName(id))}</b><span class="num ${signCl(s.cf)}">${eur(s.cf)}</span></div>

    ${kv("Argent mis en épargne cette année (net)", eur(st.ep), "muted")}</div>
  ${perfCard()}
  <div class="card"><h2>Mois par mois</h2>${months.map(m => `<div class="mrow"><span>${m.nm}</span><div class="bars"><div class="bar"><i style="width:${Math.round(m.rec/mx*100)}%"></i></div><div class="bar"><i class="warn" style="width:${Math.round(m.dep/mx*100)}%"></i></div></div><span class="num small ${signCl(m.rec-m.dep)}">${eur(m.rec - m.dep)}</span></div>`).join("")}
    <div class="small muted">Bleu : loyers · orange : charges (encaissé + prévu).</div></div>
  <div class="card"><h2>Toutes les années</h2><div class="rows">${years.slice().reverse().map(yy => { const s = stats(null, yy); return `<div class="row"><div class="main"><div class="t">${yy}</div>

}

/* ============ Import ============ */
async function onFile(file){
  try {
    if (/\.json$/i.test(file.name)){
      const obj = JSON.parse(await file.text()); if (!obj || !Array.isArray(obj.journal)) throw new Error("Sauvegarde non reconnue.");
      V.pending = {kind:"json", name:file.name, data:obj, d:{journal:obj.journal, biens:obj.biens || [], factures:[], locataires:obj.locataires || []}};
    } else {
      const wb = XLSX.read(await file.arrayBuffer(), {type:"array", sheets:["Biens_appli","Tarifs_appli","Journal_appli","Factures_appli","Locataires_appli","Reglages_appli","FraisPartages_appli"]});
      const d = parseEchange(wb); if (!d) throw new Error("feuilles « …_appli » introuvables (utilise le bouton d'export de la macro Excel).");
      V.pending = {kind:"echange", name:file.name, d};
    }
    V.msg = ""; render();
  } catch(e){ V.pending = null; V.msg = "Lecture impossible : " + e.message; render(); }
}
function bkSummary(o){

  return "Sauvegarde complète : " + nb + " bien(s), " + nl + " locataire(s), " + no + " opération(s), bailleur : " + ((o.cfg && o.cfg.bailleur) || "non renseigné") + "." + (o.demo ? " ⚠ Ce sont des données d'exemple (version d'essai), pas tes vraies données." : "") + (!nb ? " ⚠ Aucun bien dans ce fichier." : "");
}
function commitImport(replace){
  const p = V.pending; if (!p) return;
  if (p.kind === "json"){ S = Object.assign(emptyData(), p.data); S.demo = false; V.msg = "Sauvegarde restaurée : " + (S.biens || []).filter(b => !b.del).length + " bien(s), " + (S.locataires || []).filter(x => !x.del).length + " locataire(s), bailleur : " + ((S.cfg && S.cfg.bailleur) || "non renseigné") + "."; }
  else {
    const d = p.d, fromExcel = !!d.biens;
    if (replace || S.demo){ const base = emptyData(); S = base; }
    S.demo = false;
    if (d.biens){ const old = new Map(S.biens.map(b => [b.id, b])), ids = new Set(d.biens.map(b => b.id));
      S.biens = d.biens.map(b => { const o = old.get(b.id); if (o && !b.adresse && o.adresse) b.adresse = o.adresse; if (o && o.emprunt && !b.emprunt) b.emprunt = o.emprunt; if (o && o.lmnp) b.lmnp = o.lmnp; if (o && o.desc) b.desc = o.desc; if (o && o.app) b.app = true; return b; }).concat(S.biens.filter(b => b.app && !ids.has(b.id))); }
    if (d.reglages){ S.cfg = S.cfg || {bailleur:"", adr:{}}; if (d.reglages.bailleur) S.cfg.bailleur = d.reglages.bailleur; if (d.reglages.bailleuradresse) S.cfg.bailleurAdr = d.reglages.bailleuradresse; }
    if (d.tarifs){ const k = t => [t.bien, t.poste, t.date].join("|"), have = new Set(d.tarifs.map(k)); S.tarifs = d.tarifs.concat(S.tarifs.filter(t => t.app && !have.has(k(t)))); }
    if (d.partages) S.partages = d.partages;
    const a = mergeJournal(S.journal, d.journal), b = mergeList(S.factures, d.factures), c = mergeList(S.locataires, d.locataires);
    V.msg = `Opérations : ${a.add} ajoutée(s), ${a.upd} mise(s) à jour${a.dup ? ", " + a.dup + " doublon(s) ignoré(s)" : ""}. Factures : ${b.add} / ${b.upd}. Locataires : ${c.add} / ${c.upd}.`;
    if (fromExcel){
      const now = new Set(idsOf(d)), t = Date.now(); let gone = 0;
      for (const list of [S.journal, S.factures, S.locataires]) for (const x of list) if (!x.del && (S.seen || []).includes(x.id) && !now.has(x.id)){ x.del = true; x.upd = t; gone++; }

}

/* ---------- Petits utilitaires ---------- */
const pref = (k, d) => { const v = lsGet(k); return v == null ? d : v; };
const stripAcc = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const CAT_COL = ["#0E8F7E","#C2528B","#D98A1F","#4F7BD9","#8E5BD1","#C2503B","#5E9B3A","#2F8FB5","#B07A3C","#6C7A89"];
const catColor = n => { let h = 0; for (const c of String(n || "Autre")) h = (h * 31 + c.charCodeAt(0)) >>> 0; return CAT_COL[h % CAT_COL.length]; };
const lastDay = (y, m) => y + "-" + pad(m + 1) + "-" + pad(new Date(y, m + 1, 0).getDate());
const soldeAt = (id, iso) => { const b = S.biens.find(x => x.id === id); return r2(N(b && b.solde0) + sum(J().filter(j => j.bien === id && j.date <= iso).map(impact))); };
const nbsp = s => String(s).replace(/[  ]/g, " ");

/* ---------- Thèmes ---------- */
const PAL_NAMES = {emeraude:"Émeraude", ocean:"Océan", violet:"Violet", soleil:"Coucher de soleil", rose:"Rose"};
const schedGet = () => { try { return Object.assign({from:"20:00", to:"07:00"}, JSON.parse(lsGet("loc-sched") || "{}")); } catch(e){ return {from:"20:00", to:"07:00"}; } };
function themeCard(){
  const cur = pref("loc-pal", "emeraude"), mode = pref("loc-theme", "auto"), sc = schedGet();
  return `<div class="card"><h2>Apparence</h2>
    <div class="small muted">Couleur de l'appli</div>
    <div class="pals">${Object.keys(PAL_NAMES).map(k => `<button class="pal ${cur === k ? "on" : ""}" data-act="pal" data-v="${k}"><i style="background:${LOC_PALS[k][0]}"></i>${PAL_NAMES[k]}</button>`).join("")}</div>
    <div class="small muted">Mode clair ou sombre</div>
    <div class="seg">${[["auto","Automatique"],["light","Clair"],["dark","Sombre"],["sched","Horaires"]].map(([k, l]) => `<button class="${mode === k ? "on" : ""}" data-act="tmode" data-v="${k}">${l}</button>`).join("")}</div>
    ${mode === "sched" ? `<div class="tl"><label class="f">Sombre à partir de<input type="time" id="sc-from" value="${sc.from}"></label><label class="f">Clair à partir de<input type="time" id="sc-to" value="${sc.to}"></label></div>
      <div class="small muted">L'heure est vérifiée chaque minute et quand tu reviens dans l'appli.</div>` : mode === "auto" ? `<div class="small muted">Suit le réglage de ton iPhone.</div>` : ""}</div>`;
}
function confortCard(){
  const st = pref("loc-start", "home"), rm = pref("loc-remind", "1");
  return `<div class="card"><h2>Confort</h2>
    <div class="small muted">Écran au démarrage (aussi après le code)</div>
    <div class="seg"><button class="${st === "home" ? "on" : ""}" data-act="set-start" data-v="home">Accueil</button><button class="${st === "add" ? "on" : ""}" data-act="set-start" data-v="add">Ajouter</button></div>
    <div class="small muted">Rappel des lignes à pointer (une fois par jour)</div>
    <div class="seg"><button class="${rm === "1" ? "on" : ""}" data-act="set-remind" data-v="1">Activé</button><button class="${rm === "0" ? "on" : ""}" data-act="set-remind" data-v="0">Désactivé</button></div></div>`;
}
setInterval(() => applyTheme(), 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) applyTheme(); });
try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => applyTheme()); } catch(e){}

  return J().filter(j => { const h = stripAcc([j.lib, j.cat, j.fourn, j.note, j.type, bienName(j.bien), j.bien, frDate(j.date), j.date, MOIS[mo(j)], fmtNum(j.montant), r2(j.montant).toFixed(2).replace(".", ",")].join(" "));
    return toks.every(t => h.includes(t) || h.includes(t.replace(".", ","))); }).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 80);
}

/* ---------- Archivage des lignes prévues ---------- */
const ARCH_DAYS = 30;
function archivePass(force){
  const t = todayIso(); let ch = 0;
  for (const j of S.journal){
    if (j.del) continue;
    if (j.arch && j.pointe !== "x"){ j.arch = false; ch++; }
    if (!j.fut && j.pointe !== "x" && j.date > t){ j.fut = true; ch++; }
    if (!j.fut || j.arch || j.pointe !== "x") continue;
    if (j.type === "Dépense" && !j.compta) continue;          // reste à saisir en compta : on ne le cache pas
    if (!j.done){ j.done = t; ch++; if (!force) continue; }
    const age = Math.round((new Date(t) - new Date(j.done)) / 864e5);
    if (force || age >= ARCH_DAYS){ j.arch = true; ch++; }
  }
  return ch;
}
const isArch = j => !!j.arch && j.pointe === "x";
const archList = () => J().filter(isArch);
const onPointe = j => { if (j.pointe === "x"){ if (j.fut) j.done = todayIso(); } else { j.arch = false; delete j.done; } };

/* emprunt d'un bien : {capital, taux, duree (mois), debut (AAAA-MM-JJ), assur (€/mois)} */
function empOf(id){ const b = S.biens.find(x => x.id === id); return b && b.emprunt && b.emprunt.capital > 0 && b.emprunt.duree > 0 && b.emprunt.debut ? b.emprunt : null; }
function amort(e){
  const n = Math.round(e.duree), r = (e.taux || 0) / 1200, cap = e.capital;
  const m = r === 0 ? cap / n : cap * r / (1 - Math.pow(1 + r, -n));
  const rows = []; let crd = cap; const y0 = +e.debut.slice(0, 4), m0 = +e.debut.slice(5, 7) - 1;
  for (let k = 0; k < n; k++){
    const it = r2(crd * r), kap = k === n - 1 ? r2(crd) : r2(m - it); crd = r2(crd - kap);
    const mm = m0 + k, y = y0 + Math.floor(mm / 12), mo = mm % 12;
    rows.push({k:k + 1, y, m:mo, mens:r2(it + kap), it, kap, crd:Math.max(0, crd)});
  }
  return {mens:r2(m), rows};
}
function empYear(id, y){
  const e = empOf(id); if (!e) return null;
  const A = amort(e), R = A.rows.filter(x => x.y === y), prev = A.rows.filter(x => x.y < y);
  const crdFin = R.length ? R[R.length - 1].crd : (prev.length ? prev[prev.length - 1].crd : e.capital);
  return {e, mens:A.mens, nb:R.length, it:r2(sum(R.map(x => x.it))), kap:r2(sum(R.map(x => x.kap))), assur:r2((e.assur || 0) * R.length), crd:crdFin};
}

/* synthèse de l'année pour un bien */
function comptaBien(id, y){
  const L = J().filter(j => j.bien === id && yr(j) === y);
  const rec = L.filter(j => j.type === "Recette");
  const loyers = r2(sum(rec.filter(j => j.cat === "Loyer").map(j => j.montant)));
  const autres = r2(sum(rec.filter(j => j.cat !== "Loyer").map(j => j.montant)));
  const dep = L.filter(j => j.type === "Dépense" && (j.compte || "Bien") !== "Perso");
  const postes = {};
  for (const j of dep){ if (j.cat === "Crédit (mensualité)") continue; const p = posteOf(j.cat), o = postes[p] || (postes[p] = {n:p, v:0, nb:0, ok:0}); o.v = r2(o.v + j.montant); o.nb++; if (j.compta) o.ok++; }
  const credit = r2(sum(dep.filter(j => j.cat === "Crédit (mensualité)").map(j => j.montant)));
  const ey = empYear(id, y);
  const charges = r2(sum(Object.values(postes).map(p => p.v)));
  const interets = ey ? ey.it : 0, assurE = ey ? ey.assur : 0;
  const aSaisir = dep.filter(j => j.pointe === "x" && !j.compta).length;
  const fact = live(S.factures).filter(f => f.date && +f.date.slice(0, 4) === y && (f.cat || "").toUpperCase() !== "" );
  return {id, y, loyers, autres, postes:Object.values(postes).sort((a, b) => b.v - a.v), credit, ey, charges, interets, assurE, aSaisir,
    resultat:r2(loyers + autres - charges - interets - assurE), fact, lignes:dep.sort((a, b) => a.date.localeCompare(b.date))};
}

/* ---------- Pages « comme sur le site » : Logements, Échéances, Dépenses, Recettes ---------- */
function cmpMerge(rows){
  if (!V.cgrp) return rows;
  const m = new Map();
  for (const r of rows){ const key = r.immo ? "i|" + r.k : r.bien + "|" + r.art, o = m.get(key);
    if (!o) m.set(key, Object.assign({}, r, {n:1, first:r.date}));
    else { o.k += "," + r.k; o.montant = r2(o.montant + r.montant); o.n++; o.done = o.done && r.done; o.pointe = o.pointe && r.pointe; if (r.date > o.date) o.date = r.date; if (r.date < o.first) o.first = r.date; } }
  return [...m.values()].map(o => o.n > 1 ? Object.assign(o, {com:o.n + " lignes du " + frDate(o.first) + " au " + frDate(o.date)}) : o);
}
function cmpDepLines(y, ids){
  const rows = [];
  for (const j of J()){ if (j.type !== "Dépense" || yr(j) !== y || !ids.includes(j.bien) || j.compte === "Perso" || j.cat === "Crédit (mensualité)") continue;
    const art = artOf(j.cat); rows.push({k:"j:" + j.id, bien:j.bien, art, com:(j.lib || j.cat) + (j.fourn ? " - " + j.fourn : ""), montant:j.montant, date:j.date, immo:isImmoArt(art), done:!!j.compta, pointe:j.pointe === "x"}); }
  for (const id of ids){ const ey = empYear(id, y); if (ey && ey.assur > 0) rows.push({k:"a|" + id + "|" + y, bien:id, art:"Assurance emprunteur", com:"Assurance emprunteur " + y + " (" + ey.nb + " mois)", montant:ey.assur, date:y + "-12-31", immo:false, done:cdone("a|" + id + "|" + y), pointe:true}); }
  return cmpMerge(rows.sort((a, b) => a.bien.localeCompare(b.bien) || a.date.localeCompare(b.date)));
}
function cmpRecLines(y, ids){
  const rows = [];
  for (const j of J()){ if (j.type !== "Recette" || yr(j) !== y || !ids.includes(j.bien)) continue;
    if (j.cat === "Loyer"){ const t = tenantFor(j.bien, j.date), chg = r2(Math.min(N(t && t.charges), j.montant));
      rows.push({k:"j:" + j.id, bien:j.bien, art:"Loyer hors charges locatives", com:j.lib || "Loyer", montant:r2(j.montant - chg), date:j.date, done:!!j.compta, pointe:j.pointe === "x"});
      if (chg > 0) rows.push({k:"j:" + j.id, bien:j.bien, art:"Provision pour charges", com:j.lib || "Loyer", montant:chg, date:j.date, done:!!j.compta, pointe:j.pointe === "x"}); }
    else rows.push({k:"j:" + j.id, bien:j.bien, art:"À classer à la main", com:j.lib || j.cat, montant:j.montant, date:j.date, done:!!j.compta, pointe:j.pointe === "x"}); }
  return cmpMerge(rows.sort((a, b) => a.bien.localeCompare(b.bien) || a.date.localeCompare(b.date)));
}
function cmpEchLines(y, ids){
  const rows = [];
  for (const id of ids){ const e = empOf(id); if (!e) continue; const A = amort(e), day = e.debut.slice(8, 10);
    for (const r of A.rows) if (r.y === y) rows.push({k:"e|" + id + "|" + y + "-" + pad(r.m + 1), bien:id, date:y + "-" + pad(r.m + 1) + "-" + day, total:r.mens, kap:r.kap, it:r.it, frais:0, crd:r.crd, done:cdone("e|" + id + "|" + y + "-" + pad(r.m + 1))}); }
  return rows;
}

/* ---------- Placements (livret A, PEL, bourse…), matelas et argent utilisable ---------- */
const PLACE_CATS = ["Bourse", "Livret A", "PEL", "Autre placement"], CAT_INT = "Intérêts placement";
function placeOf(id){
  const L = J().filter(j => (id == null || j.bien === id) && (PLACE_CATS.includes(j.cat) || j.cat === CAT_INT)), by = {};
  for (const c of PLACE_CATS){ const l = L.filter(j => j.cat === c); by[c] = r2(sum(l.filter(j => j.type === "Sortie").map(j => j.montant)) - sum(l.filter(j => j.type === "Entrée").map(j => j.montant))); }
  const interets = r2(sum(L.filter(j => j.cat === CAT_INT).map(j => j.montant))), net = r2(sum(Object.values(by)));
  return {by, interets, net, total:r2(net + interets)};
}
function matelasOf(id){
  const t = todayIso(), loyer = suggest(id, "Loyer", t) || 0, mat = r2(12 * loyer), compte = soldeBien(id), pl = placeOf(id), total = r2(compte + pl.total);
  const lim = new Date(Date.now() + 90 * 864e5).toISOString().slice(0, 10);
  const pend = J().filter(j => j.bien === id && j.pointe !== "x" && j.date <= lim && j.compte !== "Perso");
  const dep = r2(sum(pend.filter(j => j.type === "Dépense").map(j => j.montant))), rec = r2(sum(pend.filter(j => j.type === "Recette").map(j => j.montant)));
  const reserve = r2(Math.max(0, dep - rec));
  return {loyer, mat, compte, place:pl.total, total, reserve, dep, rec, usable:r2(total - mat - reserve)};
}
function gaugeHtml(m){
  const max = Math.max(m.total, m.mat + m.reserve, 1), pc = v => Math.max(0, Math.min(100, v / max * 100)).toFixed(1);
  const a = Math.min(Math.max(m.total, 0), m.mat), b = Math.min(Math.max(m.total - m.mat, 0), m.reserve), c = Math.max(0, m.total - m.mat - m.reserve);
  return `<div class="mg" role="img" aria-label="Matelas, réserve et argent utilisable"><i style="width:${pc(a)}%;background:#3F6FB5"></i><i style="width:${pc(b)}%;background:#E8890C"></i><i style="width:${pc(c)}%;background:#1FA45B"></i></div>
    <div class="mgl"><span><b style="background:#3F6FB5"></b>Matelas ${eur(m.mat)}</span><span><b style="background:#E8890C"></b>Réservé ${eur(m.reserve)}</span><span><b style="background:#1FA45B"></b>Utilisable ${eur(Math.max(0, m.usable))}</span></div>`;
}
function matelasCard(id){

    <div class="small muted">Utilisable aujourd'hui sans te mettre en difficulté</div><div class="big num ${neg ? "neg" : ""}" style="font-size:30px;font-weight:700">${neg ? "manque " + eur(-m.usable) : eur(m.usable)}</div>${gaugeHtml(m)}

    ${kv("Matelas : 12 mois de loyer (12 × " + eur(m.loyer) + ")", "− " + eur(m.mat))}${kv("Réservé : 3 prochains mois", "− " + eur(m.reserve))}

/* ---------- PDF : images JPEG + écriture finale (remplace PdfDoc.finish) ---------- */
PdfDoc.prototype.image = function(x, y, w, h, o){   // o = {d:"data:image/jpeg;base64,…", w, h}
  this.imgs = this.imgs || []; this.pageImg = this.pageImg || {};
  const k = this.imgs.length; this.imgs.push(o); const p = this.pages.length - 1; (this.pageImg[p] = this.pageImg[p] || []).push(k);
  this.cur.push(`q ${w.toFixed(1)} 0 0 ${h.toFixed(1)} ${x.toFixed(1)} ${y.toFixed(1)} cm /Im${k} Do Q`); };
PdfDoc.prototype.finish = function(sub){
  const n = this.pages.length, imgs = this.imgs || [], parts = [], off = []; let pos = 0;
  const put = s => { parts.push(s); pos += s.length; };
  put("%PDF-1.4\n%\xE2\xE3\xCF\xD3\n");
  const add = body => { off.push(pos); put(off.length + " 0 obj\n" + body + "\nendobj\n"); };
  const idPage = i => 5 + i * 2, idCont = i => 6 + i * 2, idImg = k => 5 + n * 2 + k;
  add("<< /Type /Catalog /Pages 2 0 R >>");
  add("<< /Type /Pages /Kids [" + this.pages.map((_, i) => idPage(i) + " 0 R").join(" ") + "] /Count " + n + " >>");
  add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>");
  add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>");
  this.pages.forEach((ops, i) => {
    const head = [], foot = [];
    if (!this.clean){ this.cur = head; this.text(this.M, this.H - 40, "Mes locations", {size:11, bold:true, color:"#0E6B5C"}); this.text(this.W - this.M, this.H - 40, sub || this.title, {size:9.5, right:true, color:"#5C6B66"}); this.line(this.M, this.H - 48, this.W - this.M, this.H - 48);
    this.cur = foot; this.line(this.M, 44, this.W - this.M, 44); this.text(this.M, 30, "Généré le " + frDate(todayIso()), {size:8.5, color:"#5C6B66"}); this.text(this.W - this.M, 30, "Page " + (i + 1) + " / " + n, {size:8.5, right:true, color:"#5C6B66"}); } else if (n > 1){ this.cur = foot; this.text(this.W - this.M, 24, "Page " + (i + 1) + " / " + n, {size:8, right:true, color:"#8A9690"}); }
    const stream = head.concat(ops, foot).join("\n"), used = (this.pageImg || {})[i] || [];
    add("<< /Type /Page /Parent 2 0 R /MediaBox [0 0 " + this.W + " " + this.H + "] /Resources << /Font << /F1 3 0 R /F2 4 0 R >>" + (used.length ? " /XObject << " + used.map(k => "/Im" + k + " " + idImg(k) + " 0 R").join(" ") + " >>" : "") + " >> /Contents " + idCont(i) + " 0 R >>");
    add("<< /Length " + stream.length + " >>\nstream\n" + stream + "\nendstream");
  });
  imgs.forEach(o => { const bin = atob(o.d.split(",")[1]);
    add("<< /Type /XObject /Subtype /Image /Width " + o.w + " /Height " + o.h + " /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length " + bin.length + " >>\nstream\n" + bin + "\nendstream"); });
  const startx = pos; let xref = "xref\n0 " + (off.length + 1) + "\n0000000000 65535 f \n" + off.map(o => String(o).padStart(10, "0") + " 00000 n \n").join("");
  put(xref + "trailer\n<< /Size " + (off.length + 1) + " /Root 1 0 R >>\nstartxref\n" + startx + "\n%%EOF");
  const out = parts.join(""), u = new Uint8Array(out.length); for (let i = 0; i < out.length; i++) u[i] = out.charCodeAt(i) & 255; return u;
};
/* texte en plusieurs lignes + tableau avec retour à la ligne et saut de page */
function wrapTxt(s, size, maxW, bold){ const out = []; for (const para of String(s ?? "").split("\n")){ let line = ""; for (const w of para.split(" ")){ const t = line ? line + " " + w : w; if (pdfW(t, size, bold) > maxW && line){ out.push(line); line = w; } else line = t; } out.push(line); } return out; }
function dTable(d, cols, rows, o){
  o = o || {}; const size = o.size || 9.5, lh = size + 3.5, pd = 4, tw = cols.reduce((a, c) => a + c.w, 0);
  const head = () => { d.need(34); d.rect(d.M, d.y - 4, tw, 16, "#E6F0ED"); let x = d.M; cols.forEach(c => { d.text(c.right ? x + c.w - pd : x + pd, d.y, c.h, {size:size - 0.5, bold:true, right:c.right, color:"#0E6B5C"}); x += c.w; }); d.y -= 18; };
  head();
  for (const r of rows){ const cells = r.cells || r, L = cells.map((s, i) => wrapTxt(s, size, cols[i].w - 2 * pd, false)), n = Math.max(1, ...L.map(l => l.length)), h = n * lh + 4;
    if (d.y - h < 60){ d.newPage(); head(); }
    if (typeof r.fill === "string") d.rect(d.M, d.y - (n - 1) * lh - 5, tw, h, r.fill);
    let x = d.M; L.forEach((ls, i) => { ls.forEach((ln, k) => d.text(cols[i].right ? x + cols[i].w - pd : x + pd, d.y - k * lh, ln, {size, right:cols[i].right, color:r.color || "#1B2430"})); x += cols[i].w; });
    d.y -= (n - 1) * lh + 5; d.line(d.M, d.y, d.M + tw, d.y); d.y -= lh - 2; }
  d.y -= 6;
}
async function pdfPhotos(d, ids, label){
  const objs = []; for (const id of ids){ const o = await phGet(id); if (o) objs.push(o); } if (!objs.length) return;
  d.need(30); d.text(d.M, d.y, label, {size:8.5, bold:true, color:"#5C6B66"}); d.y -= 8;
  const W = 118, gap = 9; let x = d.M, rowH = 0;
  for (const o of objs){ const h = Math.min(100, W * o.h / o.w), w = h === 100 ? 100 * o.w / o.h : W;
    if (x + w > d.W - d.M + 1){ x = d.M; d.y -= rowH + 8; rowH = 0; }
    if (d.y - h < 60){ d.newPage(); x = d.M; rowH = 0; }
    d.image(x, d.y - h, w, h, o); x += w + gap; rowH = Math.max(rowH, h); }
  d.y -= rowH + 12;
}

/* ---------- Solde et historique des loyers du locataire ---------- */
function soldeLoc(bien){
  const t = tenantFor(bien, todayIso()), start = t && t.debut ? t.debut : "0000-00-00", end = t && t.fin && t.fin < todayIso() ? t.fin : todayIso();
  const L = J().filter(j => j.bien === bien && j.type === "Recette" && j.cat === "Loyer" && j.date >= start && j.date <= end).sort((a, b) => a.date.localeCompare(b.date));
  const du = r2(sum(L.map(j => j.montant))), recu = r2(sum(L.filter(j => j.pointe === "x").map(j => j.montant)));
  return {t, L, du, recu, solde:r2(recu - du), retard:L.filter(j => j.pointe !== "x")};
}
function soldeLine(id){
  const s = soldeLoc(id); if (!s.t) return "";
  return `<div class="small ${s.solde < -0.005 ? "neg" : "muted"}">Loyers reçus ${eur(s.recu)} sur ${eur(s.du)} dus${s.solde < -0.005 ? " · en retard de " + eur(-s.solde) : s.solde > 0.005 ? " · en avance de " + eur(s.solde) : " · à jour"}</div>`;
}

/* ---------- Performance (page Bilan) ---------- */
function occupation(id, y){
  const t0 = Date.parse(y + "-01-01"), tEnd = Math.min(Date.parse(y + "-12-31"), Date.parse(todayIso())); if (tEnd < t0) return null;
  const days = Math.round((tEnd - t0) / 864e5) + 1;
  const iv = live(S.locataires).filter(t => t.bien === id).map(t => [Math.max(t0, t.debut ? Date.parse(t.debut) : t0), Math.min(tEnd, t.fin ? Date.parse(t.fin) : tEnd)]).filter(x => x[1] >= x[0]).sort((a, b) => a[0] - b[0]);
  let cov = 0, cur = null; for (const x of iv){ if (!cur) cur = x.slice(); else if (x[0] <= cur[1] + 864e5) cur[1] = Math.max(cur[1], x[1]); else { cov += Math.round((cur[1] - cur[0]) / 864e5) + 1; cur = x.slice(); } }
  if (cur) cov += Math.round((cur[1] - cur[0]) / 864e5) + 1; return Math.min(100, Math.round(cov / days * 100));
}

  return new Promise(res => { try { const q = db.transaction("p").objectStore("p").get("f:" + fid); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); } catch(e){ res(null); } }); }

  return new Promise(res => { try { const tx = db.transaction("p", "readwrite"); tx.objectStore("p").delete("f:" + fid); tx.oncomplete = tx.onerror = tx.onabort = () => res(); } catch(e){ res(); } }); }

function normEtat(s){ const t = String(s || "").toLowerCase(); if (!t.trim()) return ""; if (/neuf/.test(t)) return "Neuf"; if (/mauvais|\bhs\b|cass|d[ée]grad|abim/.test(t)) return "Mauvais"; if (/moyen|us[ée]|usag|passable|v[ée]tust/.test(t)) return "Moyen"; if (/bon|correct|satisf|\bok\b|propre/.test(t)) return "Bon"; return ""; }
function invFromSheet(buf, name){
  try {
    let wb; if (/\.csv$/i.test(name || "")){ const txt = new TextDecoder("utf-8").decode(new Uint8Array(buf)).replace(/^\uFEFF/, ""), first = txt.split("\n")[0] || "", fs = [";", "\t", ","].map(d => [d, first.split(d).length]).sort((a, b) => b[1] - a[1])[0][0]; wb = XLSX.read(txt, {type:"string", FS:fs}); } else wb = XLSX.read(buf, {type:"array"});
    const ws = wb.Sheets[wb.SheetNames[0]], rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:"", raw:false}).map(r => r.map(c => String(c ?? "").trim()));
    let h = -1, c = {nom:0, qte:-1, etat:-1, com:-1, grp:-1};
    for (let i = 0; i < Math.min(15, rows.length) && h < 0; i++){ const r = rows[i], ni = r.findIndex(x => /d[ée]signation|article|objet|mobilier|[ée]l[ée]ment|libell|nom/i.test(x));
      if (ni >= 0 && r.filter(Boolean).length >= 2){ h = i; c = {nom:ni, qte:r.findIndex(x => /qt|quantit|nombre|^nb/i.test(x)), etat:r.findIndex(x => /[ée]tat/i.test(x)), com:r.findIndex(x => /obs|comment|remarque|note/i.test(x)), grp:r.findIndex(x => /pi[eè]ce|cat[ée]gorie|groupe|local/i.test(x))}; } }
    if (h < 0){ const sec = rows.filter(r => /^\d+([.,]\d+)?$/.test(r[1] || "")).length; c.qte = sec > rows.length / 3 ? 1 : -1; }
    const multi = c.qte >= 0 || c.etat >= 0 || c.com >= 0, out = []; let grp = "Importé";
    for (const r of rows.slice(h + 1)){ const nom = (r[c.nom] || "").trim(); if (!nom) continue;
      const qte = c.qte >= 0 ? r[c.qte] : "", raw = c.etat >= 0 ? r[c.etat] : "", obs = c.com >= 0 ? r[c.com] : "";
      if (multi && c.grp < 0 && !qte && !raw && !obs){ grp = nom; continue; }
      const et = normEtat(raw), com = [obs, raw && !et ? raw : ""].filter(Boolean).join(" · ");
      out.push({id:uid(), grp:c.grp >= 0 && r[c.grp] ? r[c.grp] : grp, nom, qte:qte || "1", etat:et, com});
      if (out.length >= 300) break; }
    return out;
  } catch(e){ return null; }
}

  return TESS_P || (TESS_P = new Promise((res, rej) => { const s = document.createElement("script"); s.src = TESS_URL; s.onload = () => res(window.Tesseract); s.onerror = () => { TESS_P = null; rej(new Error("lecture optique indisponible (connexion ?)")); }; document.head.appendChild(s); }));
}
/* Document scanné : on dessine chaque page puis on reconnaît le texte sur l'appareil (aucun envoi du document). */
async function ocrPdf(doc){
  const T = await loadTess(), out = [], n = Math.min(doc.numPages, 10);
  toast("Lecture du scan… (premier chargement : un peu long)");
  const w = await T.createWorker("fra", 1, {workerPath:TESS_WK, corePath:TESS_CORE, langPath:TESS_LANG});
  try {
    for (let i = 1; i <= n; i++){
      toast("Lecture du scan : page " + i + " sur " + n);
      const pg = await doc.getPage(i), vp = pg.getViewport({scale:2}), cv = document.createElement("canvas"); cv.width = vp.width; cv.height = vp.height;
      await pg.render({canvasContext:cv.getContext("2d"), viewport:vp}).promise;
      const r = await w.recognize(cv); r.data.text.split(/\r?\n/).forEach(l => { l = l.replace(/[|_]+/g, " ").replace(/\s+/g, " ").trim(); if (l) out.push(l); });
    }
  } finally { try { await w.terminate(); } catch(e){} }
  OCR_USED = true; return out;
}
async function pdfLines(buf){
  OCR_USED = false;
  const lib = await loadPdfJs(), doc = await lib.getDocument({data:new Uint8Array(buf.slice(0))}).promise, out = [];
  for (let n = 1; n <= doc.numPages && n <= 40; n++){
    const tc = await (await doc.getPage(n)).getTextContent(), rows = [];
    for (const it of tc.items){ if (!it.str || !it.str.trim()) continue; const y = Math.round(it.transform[5] / 3); let r = rows.find(q => Math.abs(q.y - y) <= 1); if (!r) rows.push(r = {y, c:[]}); r.c.push({x:it.transform[4], w:it.width || 0, s:it.str.trim()}); }
    rows.sort((a, b) => b.y - a.y).forEach(r => { r.c.sort((a, b) => a.x - b.x); let line = "", end = null; for (const c of r.c){ line += (end === null ? "" : (c.x - end > 18 ? " ; " : " ")) + c.s; end = c.x + c.w; } out.push(line); });
  }
  if (out.join("").length < 30) return await ocrPdf(doc);
  return out;
}
/* Lit un texte libre : « Lit ; 1 ; Bon ; rayure », « 4 chaises », « Cuisine : » (= titre de groupe). */
const ETAT_W = /^(neuf|neuve|bon|bonne|moyen|moyenne|mauvais|mauvaise|usagée?|usé|usée|passable|parfait|parfaite|correct|ok|hs)$/i;
function parseList(text){
  let lines = String(text || "").split(/\r?\n/);
  const start = lines.findIndex(l => /liste des meubles|^\s*[eé]l[eé]ment\b/i.test(l)); if (start >= 0) lines = lines.slice(start + 1);
  const tabular = lines.filter(l => /\s(neuf|bon|moyen|mauvais|usag[eé]e?)\s*$/i.test(l.replace(/état\s+d['’]usure/ig, "usagé").replace(/\bbon\s+[eé]tat\b/ig, "bon"))).length >= 8;
  const out = []; let grp = "Importé";
  for (let raw of lines){
    let line = raw.replace(/^[\s•\-–*·]+/, "").trim(); if (!line || /^page\s*\d+/i.test(line) || /paraphes|^el[ée]ment\b|^liste des meubles|signature|exemplaires|certifi/i.test(line) || line.length > 160) continue;
    line = line.replace(/[eé]tat\s+d['’]usure/ig, "usagé").replace(/\bbon\s+[eé]tat\b/ig, "bon").replace(/\b(neuf|bon|moyen|mauvais)\s+[eé]tat\b/ig, "$1");
    if (/:$/.test(line)){ grp = line.replace(/:$/, "").trim() || grp; continue; }
    if (/^[A-ZÉÈÊÀÂÎÔÛÇ' \/-]{3,28}$/.test(line) && !/\d/.test(line)){ grp = line.charAt(0) + line.slice(1).toLowerCase(); continue; }
    const parts = line.split(/\s*;\s*|\t+/).map(x => x.trim()).filter(Boolean); let nom = "", qte = "", etat = "", com = [];
    for (const p of parts){
      const tk = p.split(/\s+/); let e2 = "", q2 = "";
      if (tk.length > 1 || parts.length > 1){
        if (tk.length && ETAT_W.test(tk[tk.length - 1].replace(/[!|.,:;)\]]+$/, ""))){ e2 = normEtat(tk.pop().replace(/[!|.,:;)\]]+$/, "")) || "Bon"; }
        if (tk.length && /^\d{1,3}[!|.,:;]?$/.test(tk[tk.length - 1]) && (tk.length > 1 || parts.length > 1)){ q2 = tk.pop().replace(/\D/g, ""); }
      }
      if (e2 && !etat) etat = e2; if (q2 && !qte) qte = q2;
      const rest = tk.join(" ").trim(); if (!rest) continue;
      if (!qte && /^\d{1,3}$/.test(rest)){ qte = rest; continue; }
      if (!nom){ const m = /^(\d{1,3})\s*[x×]?\s+(.+)$/i.exec(rest); if (m && !qte){ qte = m[1]; nom = m[2]; } else nom = rest; } else com.push(rest);
    }
    if (!nom) continue;
    if (tabular && !etat && !qte){
      if (!/\d/.test(nom) && nom.split(/\s+/).length <= 3 && /^[A-ZÉÈÊÀ]/.test(nom) && !/[()]/.test(nom)){ grp = nom; continue; }
      if (out.length){ const l = out[out.length - 1]; l.com = (l.com ? l.com + " " : "") + nom; } continue; }
    out.push({id:uid(), grp, nom, qte:qte || "1", etat, com:com.join(" · ")});
    if (out.length >= 400) break;
  }
  return out;
}
/* Sortie créée directement depuis un fichier d'entrée choisi dans la fenêtre « Nouvelle sortie » */
async function dxCreateFromFile(kind, f){

  if (f.size > 25e6) return toast("Fichier trop gros (25 Mo maximum)");
  try {
    const buf = await f.arrayBuffer(), fid = uid(), type = f.type || mimeOf(f.name);
    await flPut(fid, {name:f.name, type, buf});
    docList("docs").push({id:fid, bien, kind, nom:"Entrée · " + f.name, sub:"", fname:f.name, date:edate, type, size:f.size, upd:Date.now()});
    let items = null, pieces = null;
    if (/\.(xlsx|xls|csv)$/i.test(f.name)){ const it = invFromSheet(buf, f.name);
      if (it && it.length){ if (kind === "inv") items = it; else { const map = {}; pieces = []; it.forEach(x => { let p = map[x.grp]; if (!p){ map[x.grp] = p = {id:uid(), nom:x.grp, items:[]}; pieces.push(p); } p.items.push({id:uid(), nom:x.nom, etat:x.etat, com:x.com, ph:[]}); }); } } }
    const eid = uid(), base = {id:eid, bien, type:"entree", date:edate, loc, rem:"", ref:"", fichier:fid, upd:Date.now()};
    const entree = kind === "inv" ? Object.assign(base, {items:items || INV_DEF.flatMap(([g, L]) => L.map(n => ({id:uid(), grp:g, nom:n, qte:"1", etat:"", com:""})))})
      : Object.assign(base, {elec:"", eau:"", gaz:"", cles:"", fumee:"", pieces:pieces || EDL_PIECES.map(p => mkPiece(p[0], p[1]))});
    docList(kind).push(entree); persist();
    if (items || pieces){ closeSheet(); dxMake(kind, "sortie", date, loc, entree, null); toast("Entrée lue : version de sortie créée"); return; }
    V.after = {kind, date, loc};
    let lines = [], note = "";
    try { if (/\.(pdf)$/i.test(f.name)) lines = await pdfLines(buf); else if (/\.txt$/i.test(f.name)) lines = new TextDecoder("utf-8").decode(new Uint8Array(buf)).split(/\r?\n/); } catch(e){ note = "Lecture du PDF impossible (" + e.message + ")."; }
    if (!note) note = lines.length ? (OCR_USED ? "Texte reconnu sur le scan (lecture optique, rarement parfaite) : relis chaque ligne. " : "") + "Corrige puis valide : la version de sortie sera créée ensuite." : "Aucun texte reconnu dans ce document. Colle ici la liste, ou envoie le fichier à Claude pour obtenir un Excel/CSV à importer.";
    sheetBulk(kind, eid, lines.join("\n"), true, note);
  } catch(err){ toast("Import impossible : " + err.message); }
}

function candScore(c){
  const cc = loyerCC(c.bien); if (!cc) return null; const r = Number(c.rev) || 0, g = Number(c.grev) || 0;
  if (r >= 3 * cc) return {lvl:"ok", txt:"Revenus × " + nf1(r / cc) + " le loyer"};
  if (c.garant === "visale") return {lvl:"ok", txt:"Garantie Visale" + (r ? " · revenus × " + nf1(r / cc) : "")};
  if (c.garant && g >= 3 * cc) return {lvl:"ok", txt:"Garant × " + nf1(g / cc) + " le loyer"};
